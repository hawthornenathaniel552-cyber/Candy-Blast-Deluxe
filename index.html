<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7715b8">
<meta name="description" content="Play Candy Blast Deluxe, the exciting candy matching puzzle adventure!">
<title>Candy Blast Deluxe</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#391078,#9b35d6,#ff70bb);
 color:white;
 text-align:center;
 min-height:100vh;
 padding:15px;
}

.container{
 max-width:480px;
 margin:auto;
}

h1{
 font-size:32px;
 margin:12px 0 5px;
 text-shadow:0 3px 8px #30004f;
}

.subtitle{
 margin-bottom:18px;
 color:#ffe4ff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-bottom:15px;
}

.stat{
 background:#ffffff24;
 border:1px solid #ffffff55;
 border-radius:14px;
 padding:12px 5px;
 font-weight:bold;
}

.stat span{
 display:block;
 font-size:20px;
 margin-top:5px;
}

.panel{
 background:#ffffff20;
 padding:15px;
 border-radius:20px;
 margin-bottom:14px;
}

.progress{
 height:12px;
 background:#ffffff40;
 border-radius:20px;
 overflow:hidden;
 margin:10px 0;
}

#progressBar{
 height:100%;
 width:0%;
 background:#ffe34d;
 transition:width .3s;
}

#board{
 display:grid;
 grid-template-columns:repeat(8,1fr);
 gap:4px;
 padding:7px;
 background:#390b70;
 border-radius:15px;
}

.cell{
 aspect-ratio:1;
 border-radius:10px;
 border:2px solid #ffffff30;
 background:#ffffff20;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:clamp(19px,6vw,29px);
 cursor:pointer;
 user-select:none;
 transition:transform .15s,background .15s;
}

.cell.selected{
 border:3px solid #ffe34d;
 transform:scale(.91);
 background:#ffffff65;
}

.cell:active{
 transform:scale(.88);
}

.buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
 margin-top:14px;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 8px;
 font-size:14px;
 font-weight:bold;
 cursor:pointer;
 background:#ffe34d;
 color:#48106d;
}

button:active{
 transform:scale(.96);
}

.boosters{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:12px;
}

.boosters button{
 background:#ff8cc9;
}

.message{
 min-height:25px;
 font-weight:bold;
 margin-top:12px;
 color:#fff4a5;
}

.overlay{
 display:none;
 position:fixed;
 inset:0;
 background:#16002bea;
 z-index:10;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal{
 width:100%;
 max-width:350px;
 background:linear-gradient(145deg,#9c35dc,#50128d);
 padding:25px;
 border-radius:22px;
 box-shadow:0 10px 40px #0008;
}

.modal h2{
 font-size:27px;
}

.modal button{
 width:100%;
 margin-top:12px;
}

footer{
 margin-top:20px;
 font-size:12px;
 opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<h1>🍬 Candy Blast 🍭</h1>
<div class="subtitle">✨ Match • Blast • Win ✨</div>

<div class="stats">
 <div class="stat">❤️ Lives<span id="lives">5</span></div>
 <div class="stat">⭐ Score<span id="score">0</span></div>
 <div class="stat">🏆 Level<span id="level">1</span></div>
</div>

<div class="panel">
 <div>Target: <b id="target">300</b></div>
 <div class="progress">
  <div id="progressBar"></div>
 </div>
 <div>Moves remaining: <b id="moves">20</b></div>
</div>

<div id="board"></div>

<div class="boosters">
 <button onclick="useBooster('bomb')">💣 Bomb <span id="bombCount">3</span></button>
 <button onclick="useBooster('rainbow')">🌈 Rainbow <span id="rainbowCount">3</span></button>
 <button onclick="useBooster('shuffle')">🔀 Shuffle</button>
</div>

<div class="buttons">
 <button onclick="restartLevel()">🔄 Restart</button>
 <button onclick="toggleSound()">🔊 <span id="soundText">Sound ON</span></button>
 <button onclick="dailyReward()">🎁 Daily Reward</button>
 <button onclick="showHome()">🏠 Home</button>
</div>

<div class="message" id="message">Match 3 or more candies to score!</div>

<footer>
 Candy Blast Deluxe • Match candies and conquer levels!
</footer>

</div>

<div class="overlay" id="overlay">
 <div class="modal">
  <h2 id="modalTitle">Level Complete!</h2>
  <p id="modalText"></p>
  <button onclick="nextLevel()">Continue 🚀</button>
  <button onclick="closeOverlay()">Close</button>
 </div>
</div>

<script>
const SIZE=8;

const candies=[
 "🍬","🍭","🍒","🍇","🍊","🍓"
];

let board=[];
let selected=null;
let score=0;
let level=1;
let lives=5;
let moves=20;
let coins=0;
let bombs=3;
let rainbows=3;
let sound=true;
let busy=false;
let won=false;
let lost=false;
let boosterMode=null;

const saved=localStorage.getItem("candyBlastDeluxe");

if(saved){
 try{
  const data=JSON.parse(saved);
  score=data.score||0;
  level=data.level||1;
  lives=data.lives??5;
  coins=data.coins||0;
  bombs=data.bombs??3;
  rainbows=data.rainbows??3;
 }catch(e){}
}

const $=id=>document.getElementById(id);

function targetScore(){
 return level*300;
}

function randomCandy(){
 return candies[Math.floor(Math.random()*candies.length)];
}

function createBoard(){
 board=Array.from({length:SIZE},()=>Array(SIZE).fill(null));

 for(let r=0;r<SIZE;r++){
  for(let c=0;c<SIZE;c++){
   let candy;
   do{
    candy=randomCandy();
   }while(
    (c>=2 && board[r][c-1]===candy && board[r][c-2]===candy)||
    (r>=2 && board[r-1][c]===candy && board[r-2][c]===candy)
   );
   board[r][c]=candy;
  }
 }

 render();
}

function render(){
 const el=$("board");
 el.innerHTML="";

 for(let r=0;r<SIZE;r++){
  for(let c=0;c<SIZE;c++){
   const cell=document.createElement("div");
   cell.className="cell";
   cell.textContent=board[r][c]||"";
   cell.dataset.r=r;
   cell.dataset.c=c;

   if(selected && selected.r===r && selected.c===c){
    cell.classList.add("selected");
   }

   cell.onclick=()=>tapCell(r,c);
   el.appendChild(cell);
  }
 }

 updateStats();
}

function updateStats(){
 $("score").textContent=score;
 $("level").textContent=level;
 $("lives").textContent=lives;
 $("moves").textContent=moves;
 $("target").textContent=targetScore();
 $("bombCount").textContent=bombs;
 $("rainbowCount").textContent=rainbows;
 $("progressBar").style.width=
 Math.min(100,score/targetScore()*100)+"%";
 $("soundText").textContent=sound?"Sound ON":"Sound OFF";
}

function save(){
 localStorage.setItem("candyBlastDeluxe",JSON.stringify({
  score,level,lives,coins,bombs,rainbows
 }));
}

function adjacent(a,b){
 return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
}

async function tapCell(r,c){
 if(busy||won||lost)return;

 if(boosterMode){
  await applyBooster(r,c);
  return;
 }

 const current={r,c};

 if(!selected){
  selected=current;
  render();
  return;
 }

 if(selected.r===r&&selected.c===c){
  selected=null;
  render();
  return;
 }

 if(!adjacent(selected,current)){
  selected=current;
  render();
  return;
 }

 const first=selected;
 selected=null;

 [board[first.r][first.c],board[r][c]]=
 [board[r][c],board[first.r][first.c]];

 render();

 if(findMatches().length===0){
  await sleep(180);
  [board[first.r][first.c],board[r][c]]=
  [board[r][c],board[first.r][first.c]];
  render();
  $("message").textContent="No match! Try another move.";
  return;
 }

 moves--;
 playSound();
 await resolveMatches();
 checkGame();
}

function findMatches(){
 let found=new Set();

 for(let r=0;r<SIZE;r++){
  for(let c=0;c<SIZE-2;c++){
   const value=board[r][c];
   if(value && value!=="🌈" &&
    board[r][c+1]===value&&board[r][c+2]===value){
    let k=c;
    while(k<SIZE&&board[r][k]===value){
     found.add(r+","+k);
     k++;
    }
   }
  }
 }

 for(let c=0;c<SIZE;c++){
  for(let r=0;r<SIZE-2;r++){
   const value=board[r][c];
   if(value && value!=="🌈" &&
    board[r+1][c]===value&&board[r+2][c]===value){
    let k=r;
    while(k<SIZE&&board[k][c]===value){
     found.add(k+","+c);
     k++;
    }
   }
  }
 }

 return [...found].map(x=>x.split(",").map(Number));
}

async function resolveMatches(){
 let matches=findMatches();
 let combo=0;

 while(matches.length){
  combo++;
  const points=matches.length*10*combo;
  score+=points;
  coins+=Math.floor(matches.length/3);
  $("message").textContent=
   "✨ "+matches.length+" candies blasted! +"+points;

  for(const [r,c] of matches){
   board[r][c]=null;
  }

  render();
  await sleep(150);

  for(let c=0;c<SIZE;c++){
   let values=[];
   for(let r=SIZE-1;r>=0;r--){
    if(board[r][c]!==null)values.push(board[r][c]);
   }

   for(let r=SIZE-1;r>=0;r--){
    board[r][c]=values[SIZE-1-r]||null;
   }

   let index=SIZE-values.length;
   for(let r=0;r<index;r++){
    board[r][c]=randomCandy();
   }
  }

  render();
  await sleep(150);
  matches=findMatches();
 }

 save();
}

function checkGame(){
 if(score>=targetScore()){
  won=true;
  $("modalTitle").textContent="🏆 Level Complete!";
  $("modalText").textContent=
   "Amazing! You completed level "+level+"!";
  $("overlay").style.display="flex";
  return;
 }

 if(moves<=0){
  lost=true;
  lives=Math.max(0,lives-1);
  $("modalTitle").textContent="Level Failed!";
  $("modalText").textContent="Try again! You can do it.";
  $("overlay").style.display="flex";
 }

 if(lives<=0){
  lost=true;
  $("modalTitle").textContent="❤️ Out of Lives!";
  $("modalText").textContent="Come back later or restart your adventure.";
  $("overlay").style.display="flex";
 }

 save();
 updateStats();
}

function nextLevel(){
 if(won){
  level++;
  score=0;
  moves=20;
  won=false;
  lost=false;
  createBoard();
  $("message").textContent="Welcome to level "+level+"!";
  save();
  $("overlay").style.display="none";
 }else{
  closeOverlay();
 }
}

function closeOverlay(){
 $("overlay").style.display="none";
}

function restartLevel(){
 if(busy)return;
 moves=20;
 score=0;
 won=false;
 lost=false;
 selected=null;
 createBoard();
 $("message").textContent="Level restarted!";
 save();
}

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function useBooster(type){
 if(busy||won||lost)return;

 if(type==="bomb"){
  if(bombs<=0){
   $("message").textContent="No bombs left!";
   return;
  }
  boosterMode="bomb";
 }

 if(type==="rainbow"){
  if(rainbows<=0){
   $("message").textContent="No rainbow boosters left!";
   return;
  }
  boosterMode="rainbow";
 }

 if(type==="shuffle"){
  board=Array.from({length:SIZE},()=>Array.from(
   {length:SIZE},randomCandy
  ));
  selected=null;
  render();
  $("message").textContent="Board shuffled!";
 }
}

async function applyBooster(r,c){
 const type=boosterMode;
 boosterMode=null;
 busy=true;

 if(type==="bomb"){
  bombs--;
  for(let i=Math.max(0,r-1);i<=Math.min(7,r+1);i++){
   for(let j=Math.max(0,c-1);j<=Math.min(7,c+1);j++){
    board[i][j]=null;
   }
  }
 }else if(type==="rainbow"){
  rainbows--;
  const chosen=board[r][c];
  for(let i=0;i<SIZE;i++){
   for(let j=0;j<SIZE;j++){
    if(board[i][j]===chosen)board[i][j]=null;
   }
  }
 }

 score+=90;
 moves--;
 await refillBoard();
 await resolveMatches();
 busy=false;
 render();
 checkGame();
}

async function refillBoard(){
 for(let c=0;c<SIZE;c++){
  let values=[];
  for(let r=SIZE-1;r>=0;r--){
   if(board[r][c]!==null)values.push(board[r][c]);
  }

  for(let r=SIZE-1;r>=0;r--){
   board[r][c]=values[SIZE-1-r]||null;
  }

  for(let r=0;r<SIZE-values.length;r++){
   board[r][c]=randomCandy();
  }
 }
 render();
}

function toggleSound(){
 sound=!sound;
 updateStats();
}

function playSound(){
 if(!sound)return;
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value=520;
  gain.gain.value=.06;
  osc.start();
  osc.stop(ctx.currentTime+.09);
 }catch(e){}
}

function dailyReward(){
 const today=new Date().toDateString();
 const previous=localStorage.getItem("candyDailyReward");

 if(previous===today){
  $("message").textContent="Daily reward already collected!";
  return;
 }

 coins+=100;
 bombs++;
 rainbows++;
 localStorage.setItem("candyDailyReward",today);
 $("message").textContent="🎁 Daily reward: 100 coins and boosters!";
 updateStats();
 save();
}

function showHome(){
 $("message").textContent=
 "Welcome to Candy Blast Deluxe! Complete levels to win!";
}

createBoard();
save();
</script>

</body>
  </html>
